<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual chassis operations architecture</title><desc id="desc">Synthetic CSV inputs pass through normalization, comparison and guardrails, producing current-state and event-history views for a conceptual interface.</desc><rect width="980" height="410" fill="#f5f1e8"/><g font-family="Arial,sans-serif" fill="#142824"><text x="40" y="45" font-size="20" font-weight="700">SYNTHETIC INPUT</text><text x="365" y="45" font-size="20" font-weight="700">CONTROLLED LOGIC</text><text x="735" y="45" font-size="20" font-weight="700">SHARED VIEW</text><g fill="#fff" stroke="#18332f" stroke-width="2"><rect x="40" y="85" width="200" height="72" rx="4"/><rect x="40" y="183" width="200" height="72" rx="4"/><rect x="40" y="281" width="200" height="72" rx="4"/></g><g font-size="16" text-anchor="middle"><text x="140" y="128">Incoming snapshot</text><text x="140" y="226">Current registry</text><text x="140" y="324">Transfer requests</text></g><rect x="345" y="111" width="240" height="216" rx="8" fill="#18332f"/><g fill="#fff" font-size="16" text-anchor="middle"><text x="465" y="160">Normalize</text><text x="465" y="205">Compare</text><text x="465" y="250">Apply guardrails</text><text x="465" y="295">Build dry-run plan</text></g><g fill="#fff" stroke="#18332f" stroke-width="2"><rect x="700" y="85" width="230" height="72" rx="4"/><rect x="700" y="183" width="230" height="72" rx="4"/><rect x="700" y="281" width="230" height="72" rx="4"/></g><g font-size="16" text-anchor="middle"><text x="815" y="128">Current-state view</text><text x="815" y="226">Event history</text><text x="815" y="324">Conceptual lookup</text></g></g><g fill="none" stroke="#e67859" stroke-width="4"><path d="M240 121h105M240 219h105M240 317h105M585 149h115M585 219h115M585 289h115"/></g><text x="490" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#40564f">LOCAL ONLY · NO AUTHENTICATION · NO EXTERNAL WRITES · NO CORPORATE DATA</text>
</svg>

